<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple UI Component</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 350px;
            padding: 24px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid #e2e8f0;
        }

        .name {
            font-size: 1.25rem;
            color: #1a202c;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .title {
            font-size: 0.875rem;
            color: #718096;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background-color: #ebf8ff;
            color: #3182ce;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #edf2f7;
            border-bottom: 1px solid #edf2f7;
            padding: 12px 0;
            margin-bottom: 20px;
        }

        .stat-item h3 {
            font-size: 1rem;
            color: #2d3748;
        }

        .stat-item p {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .btn {
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 0;
            width: 100%;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Replace with any image URL -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="User Avatar" class="avatar">
        <h2 class="name">Sarah Jenkins</h2>
        <p class="title">Product Designer</p>
        <span class="badge">Pro Member</span>
        
        <div class="stats">
            <div class="stat-item">
                <h3>142</h3>
                <p>Projects</p>
            </div>
            <div class="stat-item">
                <h3>4.8k</h3>
                <p>Followers</p>
            </div>
            <div class="stat-item">
                <h3>320</h3>
                <p>Following</p>
            </div>
        </div>

        <button class="btn">Connect</button>
    </div>

</body>
</html>
